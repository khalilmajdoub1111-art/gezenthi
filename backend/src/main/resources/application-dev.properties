# Local development only.
# Adds fictional demo catalogue (db/dev-seed). Never enable this location in production.
spring.flyway.locations=classpath:db/migration,classpath:db/dev-seed
# Demo seed is V1000; real migrations added later (V3, V4…) must still apply.
spring.flyway.out-of-order=true

# TunisiaBeds account is in TEST mode: only hotel 171 is assigned to it, and a search
# containing any non-assigned hotel is rejected entirely ("Hôtel(s) non affecter").
# Remove this line (or set TUNISIABEDS_ONLY_HOTELS=) once TunisiaBeds switches the account to production.
gezenthi.suppliers.tunisiabeds.only-hotels=${TUNISIABEDS_ONLY_HOTELS:171}
