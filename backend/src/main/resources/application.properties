spring.application.name=gezenthi-backend
server.port=8080

# 'dev' unless the server sets SPRING_PROFILES_ACTIVE (e.g. prod)
spring.profiles.default=dev

# Errors are returned as RFC 9457 problem details (JSON)
spring.mvc.problemdetails.enabled=true

# ---------------------------------------------------------------------------
# Database credentials are NEVER stored in the repo.
# Local dev: read from %USERPROFILE%/.gezenthi/db.env (DB_URL, DB_USERNAME, DB_PASSWORD).
# Server: provide the same names as environment variables.
# ---------------------------------------------------------------------------
spring.config.import=optional:file:${user.home}/.gezenthi/db.env[.properties]
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Schema is owned by Flyway migrations (src/main/resources/db/migration);
# Hibernate only checks that entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Admin session cookie: not readable by JavaScript, not sent cross-site, 2h idle timeout.
server.servlet.session.timeout=2h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Set to true in production (HTTPS only).
server.servlet.session.cookie.secure=false

# ---------------------------------------------------------------------------
# Hotel suppliers (B2B APIs). Credentials ONLY via env file / environment variables.
# TunisiaBeds runs the OS-TRAVEL Hotel API v2 (docs: https://api-edocs.os-travel.com).
# Disabled until TUNISIABEDS_ENABLED=true; booking is impossible while booking-enabled=false.
# ---------------------------------------------------------------------------
gezenthi.suppliers.tunisiabeds.type=os-travel
gezenthi.suppliers.tunisiabeds.name=TunisiaBeds
gezenthi.suppliers.tunisiabeds.base-url=${TUNISIABEDS_BASE_URL:https://admin.tunisiabeds.tn}
gezenthi.suppliers.tunisiabeds.login=${TUNISIABEDS_LOGIN:}
gezenthi.suppliers.tunisiabeds.password=${TUNISIABEDS_PASSWORD:}
gezenthi.suppliers.tunisiabeds.enabled=${TUNISIABEDS_ENABLED:false}
gezenthi.suppliers.tunisiabeds.markup-percent=${TUNISIABEDS_MARKUP_PERCENT:10}
gezenthi.suppliers.tunisiabeds.countries=tn
gezenthi.suppliers.tunisiabeds.booking-enabled=false

# Only expose a minimal health check
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
